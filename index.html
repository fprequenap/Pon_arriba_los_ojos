<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pon arriba los ojos</title>
<meta name="description" content="Tratado devocional con la Regla de San Benito y el Salterio, en lectura diaria de ciclo triple. Francisco de Paula Requena Paredes.">
<meta name="theme-color" content="#0E1424">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pon arriba">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4ECD8; --surface:#FBF6EA; --surface2:#F1E7CE;
  --ink:#241F17; --muted:#6E6047; --gold:#A9791B; --gold-soft:#C6A24A;
  --rule:#E1D4B6; --indigo:#1B2A4A; --accent:#8A2B1F;
  --shadow:0 1px 3px rgba(40,30,10,.10),0 6px 22px rgba(40,30,10,.06);
  --fs:1; --serif:'EB Garamond',Georgia,'Times New Roman',serif;
  --display:'Cormorant Garamond','EB Garamond',Georgia,serif;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
:root[data-theme="night"]{
  --bg:#12100B; --surface:#1A170F; --surface2:#211D12;
  --ink:#E9DFC6; --muted:#A99B78; --gold:#C9A24A; --gold-soft:#D9B968;
  --rule:#2C2618; --indigo:#D9B968; --accent:#D68A6E;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="day"]):not([data-theme="night"]){
    --bg:#12100B; --surface:#1A170F; --surface2:#211D12;
    --ink:#E9DFC6; --muted:#A99B78; --gold:#C9A24A; --gold-soft:#D9B968;
    --rule:#2C2618; --indigo:#D9B968; --accent:#D68A6E;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--serif);
  font-size:calc(18px*var(--fs)); line-height:1.62; -webkit-text-size-adjust:100%;
  padding-top:var(--safeT);
}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer}

/* ---------- top bar ---------- */
#topbar{
  position:sticky; top:0; z-index:20; background:var(--indigo); color:#F4ECD8;
  padding:calc(10px + var(--safeT)) 16px 10px; text-align:center;
  border-bottom:2px solid var(--gold);
}
:root[data-theme="night"] #topbar, :root:not([data-theme="day"]) #topbar{ background:#0E1424; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="day"]) #topbar{background:#0E1424} }
#topbar .t{ font-family:var(--display); font-weight:700; font-size:1.35em; letter-spacing:.02em; line-height:1.05;}
#topbar .s{ font-family:var(--display); font-style:italic; font-size:.82em; color:var(--gold-soft); opacity:.95; margin-top:2px}
#topbar .ctx{ font-size:.66em; text-transform:uppercase; letter-spacing:.18em; opacity:.75; margin-top:6px; min-height:1em}

/* ---------- main ---------- */
#app{ max-width:720px; margin:0 auto; padding:18px 16px calc(96px + var(--safeB)); }
.view{ animation:fade .25s ease both }
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:14px;
  padding:20px 20px; margin:0 0 18px; box-shadow:var(--shadow);
}
.card.rule{ background:var(--surface2); }
.eyebrow{ font-family:var(--display); font-style:italic; color:var(--gold); font-size:1.02em; margin:0 0 2px}
.kicker{ text-transform:uppercase; letter-spacing:.18em; font-size:.68em; color:var(--muted); font-weight:600 }
h1,h2,h3{ font-family:var(--display); font-weight:700; line-height:1.12; margin:.1em 0 .35em; color:var(--ink) }
h1{ font-size:1.9em } h2{ font-size:1.5em } h3{ font-size:1.2em }
.meditation p{ margin:0 0 .95em; text-align:justify; hyphens:auto }
.meditation p:first-of-type::first-letter{
  font-family:var(--display); font-weight:700; float:left; font-size:3.1em; line-height:.82;
  padding:.02em .10em 0 0; color:var(--gold);
}
.salmo{ font-family:var(--display); font-style:italic; color:var(--muted); font-size:1.02em;
  border-top:1px solid var(--rule); margin-top:14px; padding-top:12px }
.reglaref{ font-size:.9em; color:var(--muted); margin-top:6px }
.divider{ height:1px;background:var(--rule);margin:16px 0 }

.pill{ display:inline-block; font-size:.66em; letter-spacing:.14em; text-transform:uppercase;
  color:var(--gold); border:1px solid var(--gold-soft); border-radius:999px; padding:3px 10px; margin:0 6px 6px 0 }
.daterow{ display:flex; gap:8px; flex-wrap:wrap; margin:2px 0 4px }
.daterow .d{ font-size:.82em; color:var(--muted) }
.daterow .d.now{ color:var(--gold); font-weight:600 }

.rowbtns{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap }
.btn{ border:1px solid var(--rule); background:var(--surface2); color:var(--ink);
  border-radius:10px; padding:9px 14px; font-size:.86em; display:inline-flex; align-items:center; gap:7px }
.btn:active{ transform:translateY(1px) }
.btn.gold{ border-color:var(--gold-soft); color:var(--gold) }
.btn.on{ background:var(--gold); color:#1a1407; border-color:var(--gold) }
.navday{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px }
.navday button{ background:none;border:1px solid var(--rule);border-radius:10px;padding:8px 12px;color:var(--muted) }
.navday .lbl{ font-family:var(--display); font-style:italic; color:var(--ink); text-align:center; flex:1 }

/* lists / tree */
.list a, .list button{ display:block; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--rule); border-radius:12px; padding:13px 15px; margin-bottom:10px; color:var(--ink) }
.list .sub{ color:var(--muted); font-size:.82em; margin-top:2px }
.booktitle{ font-family:var(--display); font-style:italic; color:var(--gold); margin:22px 0 8px; font-size:1.15em }
.chaphead{ font-family:var(--display); font-weight:700; font-size:1.25em; margin:4px 0 2px }

/* segmented */
.seg{ display:flex; gap:6px; background:var(--surface2); border:1px solid var(--rule);
  border-radius:12px; padding:4px; margin-bottom:16px }
.seg button{ flex:1; border:none; background:none; padding:9px 6px; border-radius:9px; color:var(--muted); font-size:.86em }
.seg button.active{ background:var(--surface); color:var(--gold); box-shadow:var(--shadow); font-weight:600 }

/* search */
.searchbox{ display:flex; gap:8px; margin-bottom:14px }
.searchbox input{ flex:1; font-family:var(--serif); font-size:1em; color:var(--ink);
  background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:12px 14px }
.searchbox input:focus{ outline:2px solid var(--gold-soft); outline-offset:0 }
.hit{ background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:13px 15px; margin-bottom:10px; cursor:pointer }
.hit .where{ font-size:.72em; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); margin-bottom:4px }
.hit mark{ background:rgba(169,121,27,.22); color:inherit; padding:0 1px; border-radius:2px }

/* settings */
.setrow{ display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--rule) }
.setrow:last-child{ border-bottom:none }
.setrow .k{ font-weight:500 } .setrow .h{ font-size:.78em; color:var(--muted) }
.choices{ display:flex; gap:6px } .choices button{ border:1px solid var(--rule); background:var(--surface2);
  border-radius:9px; padding:7px 11px; font-size:.82em; color:var(--muted) }
.choices button.active{ background:var(--gold); color:#1a1407; border-color:var(--gold) }

.empty{ text-align:center; color:var(--muted); font-style:italic; padding:40px 10px; font-family:var(--display); font-size:1.15em }

/* ---------- bottom nav ---------- */
#nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--surface); border-top:1px solid var(--rule);
  display:flex; padding:6px 6px calc(6px + var(--safeB)); box-shadow:0 -2px 14px rgba(40,30,10,.06)
}
#nav button{ flex:1; background:none; border:none; padding:8px 2px; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; gap:3px; font-size:.66em; letter-spacing:.04em }
#nav button svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.6 }
#nav button.active{ color:var(--gold) }
#nav button.active svg{ stroke:var(--gold) }

.reader h2.chaphead{ color:var(--ink) }
.footnote{ font-size:.8em; color:var(--muted); text-align:center; margin-top:22px; font-style:italic; font-family:var(--display) }
.updated{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + var(--safeB));
  background:var(--indigo); color:#F4ECD8; padding:9px 16px; border-radius:999px; font-size:.8em;
  box-shadow:var(--shadow); z-index:40; opacity:0; pointer-events:none; transition:opacity .3s }
.updated.show{ opacity:1 }
</style>
</head>
<body>
<header id="topbar">
  <div class="t">Pon arriba los ojos</div>
  <div class="s">La Regla, la Lámpara y el Resto Fiel</div>
  <div class="ctx" id="ctx"></div>
</header>

<main id="app"><div class="empty">Cargando…</div></main>

<nav id="nav">
  <button data-route="hoy" class="active">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2 2M17.1 17.1l2 2M19.1 4.9l-2 2M6.9 17.1l-2 2"/></svg>
    Hoy</button>
  <button data-route="lector">
    <svg viewBox="0 0 24 24"><path d="M12 5c-2-1.5-5-1.5-7 0v13c2-1.5 5-1.5 7 0 2-1.5 5-1.5 7 0V5c-2-1.5-5-1.5-7 0z"/><path d="M12 5v14"/></svg>
    Lector</button>
  <button data-route="buscar">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
    Buscar</button>
  <button data-route="marcadores">
    <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
    Marcadores</button>
  <button data-route="ajustes">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2 2M17.1 17.1l2 2M19.1 4.9l-2 2M6.9 17.1l-2 2"/></svg>
    Ajustes</button>
</nav>

<div class="updated" id="toast">Nueva versión disponible…</div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
